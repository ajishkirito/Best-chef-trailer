<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Best Chef Trainer - Privacy Settings</title>
<style>
body{background:#0b100d;color:#f6f3eb;font-family:Arial;padding:20px}
.card{max-width:500px;margin:auto;background:#17211c;padding:22px;border-radius:18px}
h2{color:#f4dfad}
.setting{padding:15px;margin:10px 0;background:#202a24;border-radius:12px}
label{display:flex;justify-content:space-between;gap:10px}
button{padding:12px;background:#d8b56e;border:0;border-radius:9px;font-weight:bold}
</style>
</head>
<body>
<div class="card">
<h2>Public & Privacy Settings</h2>

<div class="setting">
<label>Public Profile <input type="radio" name="visibility" value="public"></label>
</div>
<div class="setting">
<label>Private Profile <input type="radio" name="visibility" value="private"></label>
</div>
<div class="setting">
<label>Show My Posts <input type="checkbox" id="posts"></label>
</div>
<div class="setting">
<label>Show My Videos <input type="checkbox" id="videos"></label>
</div>
<div class="setting">
<label>Allow Messages <input type="checkbox" id="messages"></label>
</div>

<button onclick="saveSettings()">Save Settings</button>
<p id="status"></p>
</div>

<script>
const defaults={
 visibility:"private",
 posts:false,
 videos:false,
 messages:false
};

function loadSettings(){
 const s={...defaults,...JSON.parse(
 localStorage.getItem("bctPrivacySettings")||"{}")};
 document.querySelector(
 'input[name="visibility"][value="'+s.visibility+'"]'
 ).checked=true;
 document.getElementById("posts").checked=s.posts;
 document.getElementById("videos").checked=s.videos;
 document.getElementById("messages").checked=s.messages;
}
function saveSettings(){
 const visibility=document.querySelector(
 'input[name="visibility"]:checked'
 )?.value||"private";
 const settings={
 visibility,
 posts:document.getElementById("posts").checked,
 videos:document.getElementById("videos").checked,
 messages:document.getElementById("messages").checked
 };
 localStorage.setItem("bctPrivacySettings",JSON.stringify(settings));
 document.getElementById("status").textContent="Settings saved on this device.";
}
loadSettings();
</script>
</body>
</html>
