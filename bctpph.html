<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Best Chef Trainer - Public Profile</title>
<style>
body{margin:0;background:#0b100d;color:#f6f3eb;font-family:Arial;padding:20px}
.card{max-width:480px;margin:30px auto;background:#17211c;padding:24px;border:1px solid #b9975c;border-radius:20px;text-align:center}
img{width:100px;height:100px;border-radius:50%;object-fit:cover}
h1{color:#f4dfad}
p{color:#c4c9c3}
button{padding:12px 20px;border:0;border-radius:10px;background:#d8b56e;font-weight:bold}
</style>
</head>
<body>
<div class="card">
  <img id="profilePhoto" src="https://placehold.co/150" alt="Profile photo">
  <h1 id="profileName">Chef Name</h1>
  <p id="profileBio">Welcome to my chef profile.</p>
  <p id="profileSkill">Culinary Student</p>
  <button onclick="followChef()">Follow</button>
  <p id="followStatus">0 Followers</p>
</div>
<script>
const profile={
 name:"Chef Name",
 bio:"Welcome to my Best Chef Trainer profile.",
 skill:"Culinary Student",
 photo:"https://placehold.co/150"
};
document.getElementById("profileName").textContent=profile.name;
document.getElementById("profileBio").textContent=profile.bio;
document.getElementById("profileSkill").textContent=profile.skill;
document.getElementById("profilePhoto").src=profile.photo;

let followers=0;
function followChef(){
 followers++;
 document.getElementById("followStatus").textContent=followers+" Followers";
}
</script>
</body>
</html>
